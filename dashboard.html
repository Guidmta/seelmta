<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen">

    <!-- Felső Menüsor -->
    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <!-- Bal oldal: Logó -->
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold text-red-500 tracking-wider">SEELMTA</span>
        </div>

        <!-- Jobb oldal: Csak a főoldalra visszajuttató gomb -->
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-sm bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 px-4 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Vissza fő oldalra
            </a>
        </div>
    </nav>

    <!-- Fő Tartalom -->
    <div class="max-w-6xl mx-auto p-6 space-y-6">
        
        <h1 class="text-2xl font-bold pt-2">Vezérlőpult</h1>

        <!-- Adatok kártyái -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Karakter Név Kártya -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h3 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Karakter Név</h3>
                <p id="character-name-card" class="text-xl font-bold text-white">Minta_Jatekos</p>
            </div>

            <!-- Készpénz Kártya -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h3 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Készpénz</h3>
                <p class="text-xl font-bold text-emerald-400">$ 150,000</p>
            </div>

            <!-- Játszott percek Kártya -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h3 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Játszott percek</h3>
                <p class="text-xl font-bold text-red-500">1,240 perc</p>
            </div>

        </div>
    </div>

    <!-- JavaScript: Átveszi a beírt nevet a bejelentkezésből -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        
        if (username) {
            document.getElementById('character-name-card').textContent = username;
        }
    </script>

</body>
</html>
