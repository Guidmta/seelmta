<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen">

    <!-- Felső Menüsor -->
    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="SEELMTA Logo" class="w-8 h-8 object-contain">
            <span class="text-xl font-bold text-red-500 tracking-wider">SEELMTA</span>
        </div>
        <a href="ucp.html" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-zinc-300 transition-colors">Kijelentkezés</a>
    </nav>

    <!-- Fő Tartalom -->
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">Üdvözlünk a Vezérlőpulton!</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Karakter info kártya -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h2 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Karakter Név</h2>
                <p class="text-xl font-bold text-white">Minta_Jatekos</p>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h2 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Készpénz</h2>
                <p class="text-xl font-bold text-emerald-400">$ 150,000</p>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
                <h2 class="text-zinc-400 text-sm font-semibold uppercase mb-2">Játszott percek</h2>
                <p class="text-xl font-bold text-red-500">1,240 perc</p>
            </div>
        </div>
    </div>

</body>
</html>
