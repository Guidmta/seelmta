<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Bejelentkezés</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen relative flex items-center justify-center overflow-hidden">

    <!-- Háttér kép és sötétítés -->
    <div class="absolute inset-0 z-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1920&auto=format&fit=crop');"></div>
    <div class="absolute inset-0 z-0 bg-gradient-to-t from-zinc-950 via-zinc-950/70 to-transparent"></div>

    <!-- Felső léc -->
    <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-10 max-w-7xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 flex items-center justify-center">
                <svg viewBox="0 0 512 512" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M256 32L448 142.4V369.6L256 480L64 369.6V142.4L256 32Z" stroke="#4ADE80" stroke-width="36" stroke-linejoin="round"/>
                    <path d="M362 176H190C165 176 150 191 150 216V232C150 257 165 272 190 272H322C347 272 362 287 362 312V328C362 353 347 368 322 368H150" stroke="#4ADE80" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wider text-white">SEELMTA</h1>
                <span class="text-[10px] text-zinc-500 tracking-widest font-semibold uppercase">UCP</span>
            </div>
        </div>

        <a href="index.html" class="bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition-colors flex items-center gap-2 backdrop-blur">
            ← Kezdőlap
        </a>
    </div>

    <!-- Bejelentkezési Doboz (A KÉPEN LÁTHATÓ) -->
    <div class="relative z-10 w-full max-w-md p-8 bg-zinc-900/90 border border-zinc-800/80 rounded-3xl shadow-2xl backdrop-blur-md space-y-6">
        <div class="text-center space-y-1">
            <h2 class="text-xl font-bold text-white tracking-wide">Bejelentkezés</h2>
            <p class="text-xs text-zinc-400">Add meg az adataid, melyekkel InGame regisztráltál.</p>
        </div>

        <!-- Itt a "dashboard.html"-re irányít át a bejelentkezés gomb -->
        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Felhasználónév</label>
                <input type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors placeholder:text-zinc-600" placeholder="">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Jelszó</label>
                    <a href="#" class="text-xs text-emerald-400 hover:underline">Elfelejtett adatok?</a>
                </div>
                <div class="relative">
                    <input type="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors pr-10" placeholder="">
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="remember" class="rounded bg-zinc-950 border-zinc-800 text-emerald-500 focus:ring-0 w-4 h-4 cursor-pointer">
                <label for="remember" class="text-xs text-zinc-400 select-none cursor-pointer">Emlékezz rám</label>
            </div>

            <button type="submit" class="w-full bg-zinc-200 hover:bg-white text-zinc-950 font-semibold py-3 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-sm mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Bejelentkezés
            </button>
        </form>
    </div>

</body>
</html>
