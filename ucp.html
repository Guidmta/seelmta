<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - User Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen flex flex-col justify-between items-center relative overflow-hidden bg-cover bg-center" style="background-image: url('monitor.png');">

    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm z-0"></div>

    <div class="absolute top-6 right-6 z-20">
        <a href="index.html" class="bg-zinc-900/80 hover:bg-zinc-800 text-zinc-200 border border-zinc-700/60 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg backdrop-blur-md flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Vissza fő oldalra
        </a>
    </div>

    <div class="relative z-10 flex flex-col items-center justify-center flex-grow w-full px-4">
        <div class="flex flex-col items-center mb-6">
            <div class="flex items-center gap-2 mb-2">
                <img src="logo.png" alt="SEELMTA Ikon" class="w-10 h-10 object-contain">
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-wider mt-1 text-red-500">SEELMTA</h1>
            <span class="text-sm tracking-widest text-zinc-300 font-medium uppercase mt-2">User Control Panel</span>
        </div>

        <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-8 w-full max-w-md shadow-2xl backdrop-blur-md">
            <div class="flex items-center gap-2 mb-6 pb-4 border-b border-zinc-800">
                <div class="bg-zinc-800 p-2 rounded-lg text-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                </div>
                <div>
                    <span class="text-xs text-zinc-400 uppercase tracking-wider block">Fiók</span>
                    <span class="text-lg font-bold text-white">Belépés</span>
                </div>
            </div>

            <form action="dashboard.html" method="GET" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Felhasználónév</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" name="username" placeholder="Felhasználónév" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-lg py-2.5 pl-10 pr-4 text-sm text-zinc-200 focus:outline-none focus:border-red-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Jelszó</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" name="password" placeholder="******" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-lg py-2.5 pl-10 pr-4 text-sm text-zinc-200 focus:outline-none focus:border-red-500 transition-colors">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm py-1">
                    <label class="flex items-center gap-2 cursor-pointer text-zinc-400 select-none">
                        <input type="checkbox" class="rounded bg-zinc-950 border-zinc-700 text-red-500 focus:ring-0 w-4 h-4">
                        <span>Adatok megjegyzése</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-red-500 hover:bg-red-400 text-zinc-950 font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-red-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    Bejelentkezés
                </button>
            </form>
        </div>
    </div>

    <footer class="relative z-10 py-6 text-xs text-zinc-500 tracking-wider">
        © 2026 SEELMTA
    </footer>

</body>
</html>
