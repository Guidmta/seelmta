<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Bejelentkezés</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen flex flex-col justify-center items-center p-6 relative">

    <!-- Jobb felső sarok: Kezdőlap gomb a kért stílusban -->
    <div class="absolute top-6 right-6">
        <a href="index.html" class="text-sm bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 px-4 py-2 rounded-xl transition-colors flex items-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="bg-gradient-to-r from-red-400 via-orange-400 to-red-500 bg-clip-text text-transparent font-medium">Kezdőlap</span>
        </a>
    </div>

    <!-- Bejelentkezési Doboz -->
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-white mb-1">Bejelentkezés</h1>
            <p class="text-zinc-400 text-xs">Add meg az adataid, melyekkel InGame regisztráltál.</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-2">Felhasználónév</label>
                <input type="text" id="username" required 
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-3 px-4 text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-zinc-300">Jelszó</label>
                    <a href="#" class="text-xs text-zinc-500 hover:text-zinc-400 transition-colors">Elfelejtett adatok?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" required 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-3 pl-4 pr-10 text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-zinc-500 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="w-full bg-zinc-200 hover:bg-white text-zinc-900 font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Bejelentkezés
            </button>
        </form>

        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-zinc-800"></div>
            <span class="flex-shrink mx-4 text-zinc-600 text-[10px] uppercase tracking-wider">vagy</span>
            <div class="flex-grow border-t border-zinc-800"></div>
        </div>

        <button class="w-full bg-zinc-950 hover:bg-zinc-800/80 text-zinc-300 border border-zinc-800 font-medium py-3 rounded-xl transition-colors flex items-center justify-center gap-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
            Bejelentkezés jelkulccsal
        </button>
    </div>

    <!-- JavaScript -->
    <script>
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value;
            window.location.href = `dashboard.html?username=${encodeURIComponent(username)}`;
        });
    </script>

</body>
</html>
