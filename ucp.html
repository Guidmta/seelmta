<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Irányítópult</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen flex">

    <!-- BAL OLDALI MENÜ -->
    <aside class="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between p-4 select-none">
        <div class="space-y-6">
            
            <!-- Logó -->
            <div class="flex items-center gap-3 px-2 pt-2">
                <div class="w-8 h-8 flex items-center justify-center bg-emerald-500/10 rounded-lg">
                    <svg viewBox="0 0 512 512" class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M256 32L448 142.4V369.6L256 480L64 369.6V142.4L256 32Z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-white">SEELMTA</h1>
                    <span class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">User Control Panel</span>
                </div>
            </div>

            <!-- PROFIL SZEKCIÓ (Fix Vendég) -->
            <div class="bg-zinc-950/50 border border-zinc-800 rounded-2xl p-4 space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-white">Vendég</h2>
                        <p class="text-[10px] text-zinc-500 uppercase font-semibold">Nincs bejelentkezve</p>
                    </div>
                </div>
            </div>

            <!-- MENÜPONTOK -->
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium bg-emerald-500/10 text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    Irányítópult
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" /></svg>
                    Járműveim
                </a>
            </nav>
        </div>
    </aside>

    <!-- JOBB OLDALI TARTALOM -->
    <main class="flex-grow p-10">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold">Üdvözöllek!</h1>
            <p class="text-zinc-500 text-sm mt-1">Jelentkezz be az adatok megtekintéséhez.</p>
            
            <div class="mt-8 p-6 border border-zinc-800 rounded-2xl bg-zinc-900/30 text-center">
                <p class="text-zinc-400 text-sm">Jelenleg nincs betöltött adat.</p>
            </div>
        </div>
    </main>

</body>
</html>
